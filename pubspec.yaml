name: kasirku_pos
description: Aplikasi Kasir Point of Sale (POS) Modern Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  image_picker: ^1.0.7
  google_fonts: ^8.2.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  pdf: ^3.10.7
  excel: ^4.0.3
  blue_thermal_printer: ^1.2.3
  permission_handler: ^13.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
